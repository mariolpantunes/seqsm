# The CI gate, moved to commit time. Mirrors `.github/workflows/ci.yml`
# step for step; if one changes, the other changes in the same commit.
#
# Every hook is `language: system`, not a pinned mirror: a mirror runs its own
# copy of the tool against a config pre-commit chose, so hooks pass while CI
# fails. The lint tools are machine installs (ruff, basedpyright, vulture, coverage)
# at exactly the versions pyproject.toml's `lint` and `test` dependency groups pin.
#
# `pass_filenames: false` on whole-project tools: basedpyright and vulture need
# to see everything, or results are wrong (false "dead code", unreferenced symbols).
#
# `files` rather than `types: [python]`: the hooks are driven by pyproject.toml, so a
# commit that changes only a manifest must still run them.
#
# Install with: pre-commit install
# Run over everything once: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      # Resolve the venv the way the runner does, before anything reads it.
      # Installs runtime deps plus the `test` dependency group from pyproject.toml.
      # Editable installs are removed first to avoid developer drift.
      - id: venv-matches-ci
        name: venv matches CI
        entry: >-
          bash -c '
          [ -d venv ] || python3 -m venv venv;
          eds=$(venv/bin/pip list --editable --format=freeze 2>/dev/null
          | sed "s/[=@ ].*//" | grep -vix seqsm || true);
          [ -n "$eds" ] && venv/bin/pip uninstall -y -q $eds;
          venv/bin/pip install -q --upgrade . --group test'
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: ruff
        name: ruff (src, test, examples)
        entry: ruff check src test examples
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      # Check-only: a hook that rewrites files mid-commit leaves the staged and
      # working trees different. Fix with `ruff format .` in a commit of its own.
      - id: ruff-format
        name: ruff format --check (src, test, examples)
        entry: ruff format --check src test examples
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: basedpyright
        name: basedpyright
        entry: basedpyright
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: vulture
        name: vulture
        entry: vulture
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: unittest
        name: unittest
        entry: env PYTHONPATH=src venv/bin/python -m unittest discover -s test
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false

      - id: coverage
        name: coverage (unittest, --fail-under)
        entry: >-
          bash -c 'NUMBA_DISABLE_JIT=1 PYTHONPATH=src venv/bin/python -m coverage run --source=seqsm
          -m unittest discover -s test -q && venv/bin/python -m coverage report
          --fail-under=85'
        language: system
        files: '(\.py$|^pyproject\.toml$)'
        pass_filenames: false
